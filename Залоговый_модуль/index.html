<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Залоговый модуль Р - прототип</title>
    <style>
:root {
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --line: #d9e0e7;
  --line-strong: #b8c2cc;
  --text: #172033;
  --muted: #64748b;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --green: #15803d;
  --green-soft: #dcfce7;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --red: #b91c1c;
  --red-soft: #fee2e2;
  --violet: #6d28d9;
  --cyan: #0ea5e9;
  --shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
  background: var(--bg);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app-shell {
  min-height: 100vh;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(260px, 320px) minmax(320px, 1fr) auto;
  gap: 20px;
  align-items: center;
  min-height: 68px;
  padding: 10px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 0;
  color: var(--text);
  text-align: left;
  background: transparent;
  border: 0;
}

.brand-mark {
  display: grid;
  width: 40px;
  height: 40px;
  place-items: center;
  color: #fff;
  background: linear-gradient(135deg, #1d4ed8, #2563eb);
  border-radius: 8px;
  font-weight: 800;
}

.brand strong,
.brand small {
  display: block;
}

.brand small,
.hint,
small {
  color: var(--muted);
}

.quick-search {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) auto;
  gap: 8px;
}

.role-box {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
}

.role-user {
  max-width: 220px;
  overflow: hidden;
  color: var(--muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.main-nav {
  position: sticky;
  top: 68px;
  z-index: 15;
  display: flex;
  gap: 6px;
  padding: 8px 28px;
  overflow-x: auto;
  background: #eef2f6;
  border-bottom: 1px solid var(--line);
}

.main-nav button,
.tabs button,
.breadcrumbs button,
.login-links button,
.link {
  color: var(--muted);
  background: transparent;
  border: 0;
}

.main-nav button {
  min-height: 36px;
  padding: 0 14px;
  border-radius: 8px;
}

.main-nav button.active,
.tabs button.active {
  color: var(--blue);
  background: var(--blue-soft);
}

.main {
  width: min(100%, 1680px);
  margin: 0 auto;
  padding: 18px 28px 48px;
}

.breadcrumbs {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 13px;
}

.page-header {
  display: flex;
  gap: 16px;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
}

.page-header h1 {
  margin: 0 0 4px;
  font-size: 26px;
  letter-spacing: 0;
}

.page-header p {
  max-width: 780px;
  margin: 0;
  color: var(--muted);
}

.header-actions,
.inline-actions,
.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
}

.btn {
  min-height: 36px;
  padding: 8px 12px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
}

.btn:hover,
.main-nav button:hover,
.tabs button:hover,
button.kpi-card:hover,
.legend-list button:hover,
.bar-row:hover {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.btn-primary {
  color: #fff;
  background: var(--blue);
  border-color: var(--blue);
}

.btn-secondary {
  background: var(--surface-soft);
}

.btn-small {
  min-height: 30px;
  padding: 5px 8px;
  font-size: 13px;
}

input,
select,
textarea {
  width: 100%;
  min-height: 36px;
  padding: 8px 10px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
}

textarea {
  min-height: 96px;
  resize: vertical;
}

label {
  display: grid;
  gap: 6px;
  color: var(--muted);
  font-size: 13px;
}

label input,
label select,
label textarea {
  color: var(--text);
  font-size: 14px;
}

.panel,
.login-card,
.object-hero,
.mobile-card,
.print-preview,
.error-state,
.empty-state.large,
.success-state {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.panel {
  padding: 18px;
  margin-bottom: 16px;
}

.panel h2,
.integration-card h2,
.mobile-card h1,
.print-preview h2 {
  margin: 0 0 12px;
  font-size: 18px;
  letter-spacing: 0;
}

.panel h3 {
  margin: 18px 0 10px;
}

.panel-title,
.card-head,
.modal-head {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
}

.panel-title h2,
.card-head h2,
.modal-head h2 {
  margin: 0;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
}

.tabs.wrap {
  flex-wrap: wrap;
  overflow: visible;
}

.tabs button {
  min-height: 36px;
  padding: 8px 12px;
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.registry-tabs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 0 0 16px;
}

.registry-tabs button {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 3px 10px;
  align-items: center;
  min-height: 64px;
  padding: 12px 14px;
  text-align: left;
  background: var(--surface);
}

.registry-tabs button span {
  color: var(--text);
  font-weight: 700;
}

.registry-tabs button small {
  grid-column: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.registry-tabs button strong {
  grid-row: 1 / span 2;
  grid-column: 2;
  min-width: 34px;
  padding: 4px 8px;
  color: var(--accent-dark);
  text-align: center;
  background: var(--accent-soft);
  border-radius: 999px;
}

.filter-grid,
.form-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(160px, 1fr));
  gap: 10px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.kpi-card {
  display: grid;
  gap: 6px;
  min-height: 86px;
  padding: 14px;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.kpi-card span {
  color: var(--muted);
}

.kpi-card strong {
  font-size: 20px;
  line-height: 1.2;
  overflow-wrap: anywhere;
  letter-spacing: 0;
}

.kpi-card.info {
  border-left: 4px solid var(--blue);
}

.kpi-card.warn {
  border-left: 4px solid var(--amber);
}

.kpi-card.danger {
  border-left: 4px solid var(--red);
}

.registry-kpi-grid {
  margin-bottom: 16px;
}

.registry-analytics {
  margin-bottom: 16px;
  align-items: start;
}

.registry-analytics.equal-height-analytics {
  align-items: stretch;
}

.registry-analytics.equal-height-analytics .chart-panel {
  height: 100%;
}

.kpi-card.active,
.legend-list button.active,
.bar-row.active {
  border-color: var(--accent, var(--blue));
  background: #eff6ff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.chart-panel .panel-title {
  margin-bottom: 14px;
}

.analytics-grid,
.grid-2,
.integration-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.contract-card-info-grid {
  grid-template-columns: minmax(300px, 0.72fr) minmax(640px, 1.28fr);
}

.contract-card-info-grid > .panel {
  min-width: 0;
}

.contract-participants-panel table {
  min-width: 0;
  table-layout: fixed;
  width: 100%;
}

.contract-participants-panel th,
.contract-participants-panel td {
  padding-right: 10px;
  padding-left: 10px;
  overflow-wrap: anywhere;
}

.contract-participants-panel th:nth-child(1),
.contract-participants-panel td:nth-child(1) {
  width: 16%;
}

.contract-participants-panel th:nth-child(2),
.contract-participants-panel td:nth-child(2) {
  width: 27%;
}

.contract-participants-panel th:nth-child(3),
.contract-participants-panel td:nth-child(3) {
  width: 14%;
}

.contract-participants-panel th:nth-child(4),
.contract-participants-panel td:nth-child(4) {
  width: 18%;
}

.contract-participants-panel th:nth-child(5),
.contract-participants-panel td:nth-child(5) {
  width: 25%;
}

.contract-linked-collaterals-table {
  min-width: 0;
  table-layout: fixed;
}

.contract-linked-collaterals-table th,
.contract-linked-collaterals-table td {
  padding-right: 10px;
  padding-left: 10px;
  overflow-wrap: anywhere;
}

.contract-linked-collaterals-table th:nth-child(1),
.contract-linked-collaterals-table td:nth-child(1) {
  width: 7%;
}

.contract-linked-collaterals-table th:nth-child(2),
.contract-linked-collaterals-table td:nth-child(2) {
  width: 11%;
}

.contract-linked-collaterals-table th:nth-child(3),
.contract-linked-collaterals-table td:nth-child(3) {
  width: 23%;
}

.contract-linked-collaterals-table th:nth-child(4),
.contract-linked-collaterals-table td:nth-child(4) {
  width: 15%;
}

.contract-linked-collaterals-table th:nth-child(5),
.contract-linked-collaterals-table td:nth-child(5),
.contract-linked-collaterals-table th:nth-child(6),
.contract-linked-collaterals-table td:nth-child(6),
.contract-linked-collaterals-table th:nth-child(7),
.contract-linked-collaterals-table td:nth-child(7) {
  width: 12%;
}

.contract-linked-collaterals-table th:nth-child(8),
.contract-linked-collaterals-table td:nth-child(8) {
  width: 8%;
}

.integration-grid {
  grid-template-columns: repeat(3, minmax(280px, 1fr));
}

.chart-panel {
  min-height: 280px;
}

.compact-bar-panel,
.compact-donut-panel {
  min-height: 216px;
}

.donut-row {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 18px;
  align-items: center;
}

.donut {
  display: grid;
  width: 146px;
  height: 146px;
  place-items: center;
  border-radius: 50%;
}

.donut span {
  display: grid;
  width: 82px;
  height: 82px;
  place-items: center;
  background: var(--surface);
  border-radius: 50%;
  font-weight: 800;
  padding: 6px;
  text-align: center;
  font-size: 13px;
  line-height: 1.15;
}

.legend-list,
.bar-list,
.doc-list,
.check-list,
.photo-wizard,
.mobile-list {
  display: grid;
  gap: 8px;
}

.legend-list button,
.bar-row,
.doc-row,
.photo-step,
.event-line,
.comment {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px;
  text-align: left;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.legend-list i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.bar-row {
  grid-template-columns: 150px 1fr 64px;
  width: 100%;
}

.compact-bar-panel .bar-list {
  gap: 5px;
}

.compact-bar-panel .bar-row {
  grid-template-columns: minmax(150px, .85fr) 1fr auto;
  min-height: 30px;
  padding: 5px 8px;
  gap: 8px;
}

.compact-bar-panel .bar-row strong {
  min-width: 112px;
  text-align: right;
  white-space: nowrap;
}

.bar-row div {
  height: 10px;
  overflow: hidden;
  background: #e2e8f0;
  border-radius: 999px;
}

.bar-row i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--blue));
  border-radius: 999px;
}

.compact-donut-panel .panel-title {
  margin-bottom: 10px;
}

.compact-donut-panel .donut-row {
  grid-template-columns: 112px 1fr;
  gap: 14px;
}

.compact-donut-panel .donut {
  width: 108px;
  height: 108px;
}

.compact-donut-panel .donut span {
  width: 62px;
  height: 62px;
  font-size: 12px;
}

.compact-donut-panel .legend-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.compact-donut-panel .legend-list button {
  min-height: 32px;
  padding: 6px 8px;
  gap: 6px;
}

.compact-donut-panel .legend-list span {
  min-width: 0;
  line-height: 1.15;
}

.compact-donut-panel .legend-list strong {
  white-space: nowrap;
}

.collateral-control-panel {
  min-height: 280px;
}

.collateral-control-grid {
  display: grid;
  gap: 8px;
}

.collateral-control-head,
.collateral-control-row {
  display: grid;
  grid-template-columns: minmax(154px, .95fr) minmax(128px, .8fr) minmax(224px, 1.35fr);
  gap: 10px;
  align-items: center;
}

.collateral-control-head {
  padding: 0 10px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.collateral-control-head span {
  min-width: 0;
  overflow-wrap: anywhere;
}

.collateral-control-row {
  width: 100%;
  min-height: 56px;
  padding: 8px 10px;
  color: var(--text);
  text-align: left;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.collateral-control-row:hover,
.collateral-control-row.active {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.12);
}

.collateral-control-row.active {
  background: #ecfeff;
}

.collateral-control-type,
.collateral-control-value {
  display: grid;
  min-width: 0;
  gap: 3px;
}

.collateral-control-type strong,
.collateral-control-value strong {
  overflow-wrap: anywhere;
}

.collateral-control-type small,
.collateral-control-metric small {
  color: var(--muted);
  font-size: 11px;
}

.collateral-control-signals {
  display: grid;
  min-width: 0;
  grid-template-columns: repeat(4, minmax(46px, 1fr));
  gap: 6px;
}

.collateral-control-bar {
  height: 8px;
  overflow: hidden;
  background: #e2e8f0;
  border-radius: 999px;
}

.collateral-control-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--blue));
  border-radius: 999px;
}

.collateral-control-row.warning .collateral-control-bar i {
  background: linear-gradient(90deg, var(--amber), var(--cyan));
}

.collateral-control-row.danger .collateral-control-bar i {
  background: linear-gradient(90deg, var(--red), var(--amber));
}

.collateral-control-metric {
  display: grid;
  min-height: 38px;
  align-content: center;
  justify-items: center;
  padding: 4px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 7px;
}

.collateral-control-metric strong {
  font-size: 16px;
  line-height: 1;
}

.collateral-control-metric.ok strong {
  color: var(--green);
}

.collateral-control-metric.warning {
  background: #fff7ed;
  border-color: #fed7aa;
}

.collateral-control-metric.warning strong {
  color: #b45309;
}

.collateral-control-metric.danger {
  background: #fef2f2;
  border-color: #fecaca;
}

.collateral-control-metric.danger strong {
  color: var(--red);
}

@media (max-width: 760px) {
  .collateral-control-head {
    display: none;
  }

  .collateral-control-row {
    grid-template-columns: 1fr;
  }

  .collateral-control-signals {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

.table-panel {
  overflow-x: auto;
}

.table-panel:focus {
  outline: none;
}

.table-panel:focus-visible {
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18), var(--shadow);
}

table {
  width: 100%;
  min-width: 900px;
  border-collapse: collapse;
}

th,
td {
  padding: 10px 12px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}

th {
  position: sticky;
  top: 0;
  z-index: 1;
  color: #334155;
  font-size: 13px;
  background: #f1f5f9;
}

tfoot td {
  font-weight: 700;
  background: #f8fafc;
}

.contract-analytics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  align-items: stretch;
  margin-bottom: 16px;
}

.contract-analytics-grid .chart-panel {
  min-height: 244px;
  margin-bottom: 0;
}

.contract-analytics-grid .panel-title {
  margin-bottom: 10px;
}

.contract-analytics-grid .panel-title h2 {
  font-size: 16px;
}

.contract-analytics-grid .panel-title .hint {
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.25;
}


.contract-analytics-grid .compact-donut-panel {
  display: grid;
  align-content: start;
}

.contract-analytics-grid .compact-donut-panel .donut-row {
  grid-template-columns: 1fr;
  gap: 8px;
  align-items: start;
}

.contract-analytics-grid .compact-donut-panel .donut {
  width: 116px;
  height: 116px;
  margin: 0 auto 2px;
}

.contract-analytics-grid .compact-donut-panel .donut span {
  width: 70px;
  height: 70px;
  padding: 4px;
  font-size: 18px;
  line-height: 1;
}

.contract-analytics-grid .compact-donut-panel .legend-list {
  grid-template-columns: 1fr;
  gap: 5px;
}

.contract-analytics-grid .compact-donut-panel .legend-list button {
  grid-template-columns: 12px minmax(0, 1fr) auto;
  min-height: 30px;
  padding: 5px 7px;
}

.contract-analytics-grid .compact-donut-panel .legend-list span {
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 1.15;
}

.contract-analytics-grid .compact-donut-panel .legend-list strong {
  min-width: 18px;
  text-align: right;
  font-size: 12px;
}

.contract-ltv-panel {
  display: grid;
  align-content: start;
}

.ltv-risk-list {
  display: grid;
  gap: 7px;
}

.ltv-risk-row {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) minmax(80px, .85fr) auto;
  gap: 8px;
  align-items: center;
  width: 100%;
  min-height: 36px;
  padding: 7px 8px;
  color: var(--text);
  text-align: left;
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.ltv-risk-row:hover,
.ltv-risk-row.active {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.ltv-risk-row.active {
  background: #eff6ff;
}

.ltv-risk-row span {
  min-width: 0;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.2;
}

.ltv-risk-row div {
  height: 8px;
  overflow: hidden;
  background: #e2e8f0;
  border-radius: 999px;
}

.ltv-risk-row i {
  display: block;
  height: 100%;
  border-radius: 999px;
}

.ltv-risk-row strong {
  min-width: 24px;
  text-align: right;
}

@media (max-width: 1320px) {
  .contract-analytics-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 760px) {
  .contract-analytics-grid {
    grid-template-columns: 1fr;
  }
}

.contracts-table {
  min-width: 1320px;
  table-layout: fixed;
}

.contracts-table th,
.contracts-table td {
  padding: 8px 9px;
  font-size: 13px;
}

.contracts-table th:nth-child(1),
.contracts-table td:nth-child(1) {

.skeleton.wide {
  grid-column: 1 / -1;
  min-height: 340px;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.login-card {
  display: grid;
  gap: 14px;
  width: min(520px, 100%);
  margin: 80px auto;
  padding: 24px;
}

.login-card h1 {
  margin: 4px 0 8px;
}

.login-links {
  display: flex;
  gap: 12px;
  justify-content: space-between;
}

.upload-zone {
  border-style: dashed;
}

.print-preview {
  min-height: 520px;
  padding: 28px;
  background: #fff;
}

.preview-box {
  display: grid;
  min-height: 220px;
  place-items: center;
  margin-top: 24px;
  color: var(--muted);
  background: var(--surface-soft);
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
}

.mobile-main {
  display: grid;
  min-height: calc(100vh - 68px);
  place-items: start center;
  padding: 18px;
}

.mobile-app-shell {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  min-height: 100vh;
  max-height: 100vh;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 18%, rgba(14, 116, 144, 0.14), transparent 34%),
    linear-gradient(180deg, #e8eef5 0%, #dfe7ef 100%);
}

.mobile-prototype-toolbar {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 60;
  display: flex;
  justify-content: flex-end;
  max-width: calc(100vw - 32px);
  padding: 0;
}

.mobile-prototype-toolbar .role-box {
  width: min(390px, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 8px;
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid rgba(174, 188, 204, 0.82);
  border-radius: 12px;
  box-shadow: 0 12px 28px rgba(17, 24, 39, 0.10);
  backdrop-filter: blur(10px);
  justify-content: flex-end;
}

.mobile-prototype-toolbar .role-box select {
  min-width: 170px;
}

@media (max-width: 520px) {
  .mobile-prototype-toolbar {
    top: 10px;
    right: 10px;
    max-width: calc(100vw - 20px);
  }

  .mobile-prototype-toolbar .role-box {
    width: auto;
    max-width: calc(100vw - 20px);
  }

  .mobile-prototype-toolbar .role-user {
    display: none;
  }

  .mobile-prototype-toolbar .role-box select {
    width: min(250px, calc(100vw - 38px));
    min-width: 0;
  }
}

.mobile-app-shell .mobile-main {
  width: 100%;
  min-height: 0;
  overflow: hidden;
  padding: 86px 16px 22px;
  place-items: center;
  box-sizing: border-box;
}

.mobile-app-shell .mobile-wrap {
  width: min(390px, calc(100vw - 32px), calc((100vh - 128px) * 390 / 844));
  height: min(844px, calc(100vh - 128px), calc((100vw - 32px) * 844 / 390));
  min-height: 0;
  max-width: 390px;
  max-height: calc(100vh - 128px);
  aspect-ratio: 390 / 844;
  overflow-y: auto;
  box-sizing: border-box;
}

.mobile-wrap {
  width: min(430px, 100%);
  min-height: 720px;
  overflow: hidden;
  background: #0f172a;
  border: 10px solid #111827;
  border-radius: 28px;
  box-shadow: 0 20px 60px rgba(15, 23, 42, 0.28);
}

.mobile-header {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 14px;
  color: #fff;
  background: #1f2937;
}

.mobile-app-shell .mobile-header h1 {
  margin: 0;
  font-size: 26px;
  line-height: 1.15;
  white-space: nowrap;
}

.mobile-header button {
  color: #fff;
  background: transparent;
  border: 0;
}

.mobile-list,
.mobile-card.detail,
.photo-wizard,
.mobile-actions {
  margin: 12px;
}

.mobile-card {
  display: grid;
  gap: 8px;
  width: calc(100% - 24px);
  margin: 12px;
  padding: 14px;
  color: var(--text);
  text-align: left;
}

.mobile-card.detail {
  width: auto;
}

.mobile-card p {
  margin: 0;
  color: var(--muted);
}

.mobile-card-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.mobile-card-meta span {
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mobile-card .info-grid {
  grid-template-columns: 1fr;
}

.mobile-actions {
  display: grid;
  gap: 8px;
}

.photo-step {
  grid-template-columns: 1fr auto;
}

.photo-step.done {
  background: var(--green-soft);
}

.mobile-photo-context {
  display: grid;
  gap: 6px;
  padding: 12px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.mobile-photo-context p {
  margin: 0;
  color: var(--muted);
}

.mobile-stage {
  display: grid;
  width: 100%;
  min-height: 0;
  place-items: center;
}

.mobile-app-shell .mobile-wrap {
  position: relative;
  display: flex;
  width: min(390px, calc(100vw - 32px), calc((100vh - 128px) * 390 / 844));
  height: min(844px, calc(100vh - 128px), calc((100vw - 32px) * 844 / 390));
  min-height: 0;
  max-width: 390px;
  max-height: calc(100vh - 128px);
  padding: 12px;
  overflow: hidden;
  aspect-ratio: 390 / 844;
  background: #0b1220;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 42px;
  box-shadow: 0 28px 70px rgba(15, 23, 42, 0.34), inset 0 0 0 6px #111827;
}

.phone-speaker {
  position: absolute;
  top: 10px;
  left: 50%;
  z-index: 4;
  width: 76px;
  height: 5px;
  background: rgba(226, 232, 240, 0.38);
  border-radius: 999px;
  transform: translateX(-50%);
}

.phone-home-indicator {
  flex: 0 0 auto;
  width: 108px;
  height: 4px;
  margin: 8px auto 0;
  background: rgba(15, 23, 42, 0.34);
  border-radius: 999px;
}

.mobile-screen {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background: #f4f7fb;
  border-radius: 30px;
}

.mobile-content {
  flex: 1;
  min-height: 0;
  padding: 12px;
  overflow-y: auto;
}

.mobile-app-shell .mobile-header {
  display: flex;
  flex: 0 0 auto;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 22px 16px 14px;
  color: #f8fafc;
  background: linear-gradient(145deg, #111827, #1f2937);
}

.mobile-app-shell .mobile-header h1 {
  margin: 0;
  color: inherit;
  font-size: 18px;
  line-height: 1.15;
  white-space: normal;
}

.mobile-header .mobile-muted {
  color: #cbd5e1;
  font-size: 12px;
}

.mobile-list,
.mobile-actions,
.photo-wizard {
  display: grid;
  gap: 10px;
  margin: 0;
}

.mobile-card {
  display: grid;
  gap: 10px;
  width: 100%;
  margin: 0;
  padding: 13px;
  color: var(--text);
  text-align: left;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 10px 26px rgba(15, 23, 42, 0.07);
}

.mobile-card.detail {
  width: auto;
}

.mobile-card h2 {
  margin: 0;
  font-size: 15px;
  line-height: 1.25;
}

.mobile-card p {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.mobile-card-top,
.mobile-section-head {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  justify-content: space-between;
}

.mobile-kicker {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.mobile-card-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mobile-card-grid div {
  min-width: 0;
  padding: 8px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.mobile-card-grid .wide {
  grid-column: 1 / -1;
}

.mobile-card-grid span {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.mobile-card-grid strong {
  display: block;
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 1.25;
}

.mobile-contact-card {
  display: grid;
  gap: 9px;
  margin-bottom: 10px;
  padding: 14px;
  color: #f8fafc;
  background: linear-gradient(145deg, #0f172a, #075985);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 16px;
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
}

.mobile-contact-card .mobile-kicker {
  color: rgba(248, 250, 252, 0.72);
}

.mobile-contact-card h3 {
  margin: 0;
  color: inherit;
  font-size: 20px;
  line-height: 1.12;
}

.mobile-contact-card p {
  margin: 0;
  color: rgba(248, 250, 252, 0.78);
  font-size: 12px;
  line-height: 1.35;
}

.mobile-contact-phone {
  display: inline-flex;
  width: fit-content;
  color: #fff;
  font-size: 18px;
  font-weight: 900;
  line-height: 1.1;
  text-decoration: none;
}

.mobile-contact-grid {
  display: grid;
  gap: 8px;
}

.mobile-contact-grid div {
  padding: 9px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
}

.mobile-contact-grid span {
  display: block;
  margin-bottom: 4px;
  color: rgba(248, 250, 252, 0.7);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
}

.mobile-contact-grid strong {
  display: block;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.35;
}

.mobile-contact-card .btn {
  width: 100%;
  color: #0f172a;
  background: #fff;
  border-color: transparent;
}

.mobile-card-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
}

.mobile-card-meta span {
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mobile-photo-toolbar {
  margin-bottom: 10px;
}

.mobile-photo-toolbar .btn {
  width: 100%;
}

.mobile-section,
.mobile-photo-context {
  display: grid;
  gap: 10px;
  margin-bottom: 10px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

.mobile-section h2,
.mobile-section h3 {
  margin: 0;
  font-size: 15px;
  line-height: 1.25;
}

.mobile-check-result {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: space-between;
  padding: 9px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 10px;
}

.mobile-check-form {
  display: grid;
  gap: 9px;
}

.mobile-check-field {
  display: grid;
  gap: 7px;
  padding: 10px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.mobile-check-field > span {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  justify-content: space-between;
}

.mobile-check-field strong {
  min-width: 0;
  font-size: 12px;
  line-height: 1.25;
}

.mobile-check-field small {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.mobile-check-field select {
  width: 100%;
  min-height: 38px;
  padding: 8px 32px 8px 10px;
  color: var(--text);
  font-size: 12px;
  line-height: 1.2;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
}

.mobile-comment-field {
  display: grid;
  gap: 6px;
}

.mobile-comment-field span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

.mobile-comment-field textarea {
  min-height: 84px;
  resize: vertical;
  font-size: 12px;
  line-height: 1.35;
}

.mobile-submit-panel {
  display: grid;
  gap: 10px;
  margin-bottom: 10px;
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
}

.mobile-submit-status {
  display: grid;
  gap: 3px;
}

.mobile-submit-status span,
.mobile-submit-status small {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}

.mobile-submit-status span {
  text-transform: uppercase;
}

.mobile-submit-status strong {
  color: var(--text);
  font-size: 13px;
  line-height: 1.25;
}

.mobile-submit-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mobile-submit-actions .btn {
  width: 100%;
  min-height: 40px;
}

.mobile-check-result span {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.25;
}

.mobile-check-result strong {
  flex: 0 0 auto;
  color: var(--accent-dark);
}

.mobile-check-result b {
  color: var(--accent-dark);
}

.photo-step {
  grid-template-columns: 1fr auto;
  padding: 11px;
  border-radius: 12px;
}

.photo-step.done {
  background: var(--green-soft);
}

.mobile-result-checklist {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 6px;
}

.mobile-result-checklist span {
  display: grid;
  gap: 2px;
  min-width: 0;
  padding: 7px 8px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.25;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.mobile-result-checklist strong {
  color: var(--text);
  font-size: 12px;
}

.comment {
  grid-template-columns: 1fr auto;
  align-items: start;
}

.comment p {
  grid-column: 1 / -1;
  margin: 0;
}

@media (max-width: 1180px) {
  .topbar {
    grid-template-columns: 1fr;
  }

  .role-box,
  .header-actions {
    justify-content: flex-start;
  }

  .kpi-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .analytics-grid,
  .grid-2,
  .integration-grid,
  .object-hero {
    grid-template-columns: 1fr;
  }

  .task-detail-layout {
    grid-template-columns: 1fr;
  }

  .inspection-task-grid,
  .revaluation-columns {
    grid-template-columns: 1fr;
  }

  .task-detail-sidebar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .task-history-panel {
    grid-column: 1 / -1;
  }

  .task-detail-sidebar .info-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .filter-grid,
  .form-grid,
  .risk-panel {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .main,
  .topbar,
  .main-nav {
    padding-right: 14px;
    padding-left: 14px;
  }

  .page-header {
    display: grid;
  }

  .quick-search,
  .hide-mobile,
  .role-user {
    display: none;
  }

  .kpi-grid,
  .filter-grid,
  .form-grid,
  .risk-panel,
  .hero-metrics,
  .info-grid,
  .donut-row {
    grid-template-columns: 1fr;
  }

  .task-detail-sidebar,
  .task-detail-sidebar .info-grid,
  .task-detail-main .task-collateral-description .info-grid,
  .inspection-task-grid,
  .inspection-checklist-grid,
  .inspection-checklist-items,
  .risk-factor-grid,
  .risk-factor-items,
  .valuation-risk-summary {
    grid-template-columns: 1fr;
  }

  .inspection-check-row {
    grid-template-columns: 1fr;
  }

  .inspection-factor-score {
    justify-items: start;
  }

  .bar-row {
    grid-template-columns: 100px 1fr 48px;
  }

  .photo-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .collateral-photo-row {
    grid-template-columns: 36px 1fr;
  }

  .collateral-photo-actions {
    grid-column: 1 / -1;
    justify-content: stretch;
  }

  .collateral-photo-actions .btn {
    flex: 1;
  }

  .toast-stack {
    right: 12px;
    bottom: 12px;
  }
}

/* Visual refresh: graphite + cyan-blue enterprise theme for Project R. */
:root {
  --bg: #eef3f8;
  --surface: #ffffff;
  --surface-soft: #f6f9fc;
  --line: #d5dee8;
  --line-strong: #aebccc;
  --text: #132238;
  --muted: #607086;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --green: #15803d;
  --green-soft: #dcfce7;
  --amber: #b45309;
  --amber-soft: #fef3c7;
  --red: #b91c1c;
  --red-soft: #fee2e2;
  --violet: #7c3aed;
  --cyan: #0891b2;
  --accent: #0891b2;
  --accent-dark: #0e7490;
  --accent-soft: #cffafe;
  --nav-dark: #111827;
  --nav-dark-2: #1f2937;
  --arm-rail: #111827;
  --arm-rail-2: #182235;
  --arm-hot: #2563eb;
  --arm-contrast: #be185d;
  --shadow: 0 16px 38px rgba(17, 24, 39, 0.10);
}

body {
  background: var(--bg);
  color: var(--text);
}

.topbar {
  background: var(--nav-dark);
  border-bottom-color: #26364d;
  color: #f7fbfb;
  box-shadow: 0 12px 26px rgba(23, 32, 51, 0.16);
}

.brand,
.brand span {
  color: #f7fbfb;
}

.brand small,
.role-user,
.quick-search svg {
  color: #cbd5e1;
}

.brand-mark {
  background: #3b82f6;
  box-shadow: inset 0 -10px 18px rgba(30, 64, 175, 0.35), 0 8px 18px rgba(0, 0, 0, 0.18);
}

.quick-search {
  background: var(--nav-dark-2);
  border-color: #334155;
}

.quick-search input,
.role-box select {
  color: #f7fbfb;
}

.quick-search input::placeholder {
  color: #94a3b8;
}

.role-box select {
  background: var(--nav-dark-2);
  border-color: #334155;
}

.role-box select:focus,
.quick-search:focus-within {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.24);
}

.topbar .btn-secondary {
  background: #223255;
  border-color: #3b82f6;
  color: #f7fbfb;
}

.topbar .btn-secondary:hover {
  background: var(--accent);
  border-color: #60a5fa;
  color: #ffffff;
}

.main-nav {
  background: var(--nav-dark-2);
  border-bottom-color: #26364d;
  box-shadow: 0 8px 18px rgba(23, 32, 51, 0.10);
}

.main-nav button {
  color: #dbe5f0;
  border: 1px solid transparent;
}

.main-nav button:hover {
  background: rgba(219, 234, 254, 0.08);
  border-color: #334155;
  color: #ffffff;
}

.main-nav button.active {
  background: var(--accent);
  color: #ffffff;
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
}

.content,
.modal-body {
  background: var(--bg);
}

.panel,
.kpi-card,
.object-hero,
.details-layout > aside,
.modal-card,
.toast,
.empty-state,
.integration-card,
.mobile-wrap,
.matrix,
.swimlane-column,
.process-step,
.form-preview {
  border-color: var(--line);
  box-shadow: var(--shadow);
}

.panel,
.modal-card,
.details-layout > aside,
.empty-state,
.swimlane-column,
.process-step,
.form-preview {
  background: var(--surface);
}

.panel-title h2,
.page-title h1,
.section-title,
.object-title h1,
.kpi-value,
.mobile-logo,
.matrix th,
th {
  color: var(--text);
}

.breadcrumb,
.page-title p,
.kpi-label,
.muted,
td small,
.object-title p,
.field-group label,
.timeline small,
.action-log small,
.document-list small,
.comment small,
.sync-log small,
.mobile-muted {
  color: var(--muted);
}

.btn {
  border-radius: 8px;
}

.btn:hover {
  border-color: #93c5fd;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #ffffff;
}

.btn-primary:hover {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
  color: #ffffff;
}

.btn-secondary {
  background: #f8fafc;
  border-color: var(--line-strong);
  color: var(--text);
}

.btn-ghost {
  color: var(--accent-dark);
}

.btn-danger {
  color: var(--red);
  border-color: #f2b7c3;
}

.icon-btn:hover,
.row-actions button:hover,
.table-view-toggle button:hover {
  background: var(--accent-soft);
  border-color: #93c5fd;
  color: var(--accent-dark);
}

.table-view-toggle button.active,
.tabs button.active,
.subtabs button.active,
.mobile-tab.active {
  background: var(--accent-soft);
  border-color: #93c5fd;
  color: var(--accent-dark);
}

.tabs,
.subtabs,
.filter-bar,
.summary-strip,
.action-strip,
.process-actions,
.import-preview,
.sync-log,
.mobile-tabs {
  background: var(--surface-soft);
  border-color: var(--line);
}

.filter-bar select,
.filter-bar input,
.field-group input,
.field-group select,
.field-group textarea,
.comment-input textarea,
.inline-editor input {
  border-color: var(--line-strong);
  background: #ffffff;
  color: var(--text);
}

.filter-bar select:focus,
.filter-bar input:focus,
.field-group input:focus,
.field-group select:focus,
.field-group textarea:focus,
.comment-input textarea:focus,
.inline-editor input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  outline: none;
}

.table-wrap {
  border-color: var(--line);
  box-shadow: 0 10px 24px rgba(23, 32, 51, 0.05);
}

th {
  background: #eff6ff;
  border-bottom-color: var(--line-strong);
}

td {
  border-bottom-color: var(--line);
}

tbody tr:hover {
  background: #fbfdff;
}

.link {
  color: var(--accent-dark);
}

.link:hover {
  color: var(--accent);
}

.kpi-card {
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border-left: 4px solid var(--line-strong);
}

.kpi-card:hover {
  transform: translateY(-1px);
}

.kpi-card.info {
  border-left-color: var(--accent);
}

.kpi-card.warn {
  border-left-color: var(--amber);
}

.kpi-card.success {
  border-left-color: var(--green);
}

.kpi-card.danger {
  border-left-color: var(--red);
}

.kpi-card.violet {
  border-left-color: var(--violet);
}

.kpi-trend {
  background: var(--accent-soft);
  color: var(--accent-dark);
}

.kpi-trend.warn {
  background: var(--amber-soft);
  color: #92400e;
}

.kpi-trend.danger {
  background: var(--red-soft);
  color: var(--red);
}

.badge {
  border: 1px solid transparent;
}

.badge.neutral {
  background: #e2e8f0;
  color: #475569;
  border-color: #cbd5e1;
}

.badge.blue,
.badge.primary {
  background: var(--accent-soft);
  color: var(--accent-dark);
  border-color: #93c5fd;
}

.badge.green {
  background: var(--green-soft);
  color: var(--green);
  border-color: #b9dfc3;
}

.badge.amber {
  background: var(--amber-soft);
  color: #92400e;
  border-color: #f3d587;
}

.badge.red {
  background: var(--red-soft);
  color: var(--red);
  border-color: #f2b7c3;
}

.badge.violet {
  background: #efedff;
  color: var(--violet);
  border-color: #d5d0ff;
}

.object-hero {
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border-top: 4px solid var(--accent);
}

.info-grid div,
.linked-card,
.document-list li,
.comment,
.action-log li,
.timeline li,
.quick-action,
.risk-card,
.metric-mini,
.scenario-card,
.mobile-card,
.mobile-item,
.chart-list li {
  background: #f8fafc;
  border-color: #d9e0e7;
}

.quick-action:hover,
.linked-card:hover,
.document-list li:hover,
.scenario-card:hover {
  border-color: #93c5fd;
  box-shadow: 0 10px 22px rgba(37, 99, 235, 0.10);
}

.timeline span,
.stepper .active,
.process-step .step-index {
  background: var(--accent-soft);
  color: var(--accent-dark);
  border-color: #93c5fd;
}

.stepper div {
  background: #eef2f8;
  color: #64748b;
}

.stepper .done {
  background: var(--green-soft);
  color: var(--green);
}

.donut span {
  background: #ffffff;
  border: 1px solid var(--line);
}

.bar-row i,
.mini-bar i {
  background: linear-gradient(90deg, var(--accent) 0%, #3b82f6 100%);
}

.bar-row.warning i,
.mini-bar.warning i {
  background: linear-gradient(90deg, var(--amber) 0%, #e1a743 100%);
}

.bar-row.danger i,
.mini-bar.danger i {
  background: linear-gradient(90deg, var(--red) 0%, #e25776 100%);
}

.integration-card {
  background: #ffffff;
  border-top: 4px solid var(--accent);
}

.integration-card.error {
  border-top-color: var(--red);
}

.integration-card.pending {
  border-top-color: var(--amber);
}

.modal-card {
  border-radius: 8px;
}

.modal-header {
  background: #f8fafc;
  border-bottom-color: var(--line);
}

.toast {
  border-left: 4px solid var(--accent);
}

.toast.error {
  border-left-color: var(--red);
}

.toast.success {
  border-left-color: var(--green);
}

.login-card {
  border-color: var(--line);
  box-shadow: 0 18px 42px rgba(23, 32, 51, 0.12);
}

.login-card::before {
  background: var(--accent);
}

.mobile-wrap {
  background: var(--nav-dark);
}

.mobile-screen {
  background: #f4f7fb;
}

.mobile-header {
  background: var(--nav-dark-2);
  color: #f7fbfb;
}

.mobile-header .mobile-muted {
  color: #cbd5e1;
}

@media (max-width: 980px) {
  .main-nav {
    background: var(--nav-dark-2);
  }

  .topbar {
    box-shadow: 0 10px 22px rgba(23, 32, 51, 0.14);
  }
}

/* Status badge refresh for generated badge-* classes. */
.badge-ok {
  color: var(--green);
  background: var(--green-soft);
  border-color: #b9dfc3;
}

.badge-warn {
  color: #92400e;
  background: var(--amber-soft);
  border-color: #f3d587;
}

.badge-danger {
  color: var(--red);
  background: var(--red-soft);
  border-color: #f2b7c3;
}

.badge-info {
  color: var(--accent-dark);
  background: var(--accent-soft);
  border-color: #93c5fd;
}

.badge-neutral {
  color: #475569;
  background: #e2e8f0;
  border-color: #cbd5e1;
}

.sort-head:hover {
  color: var(--accent-dark);
}

/* Collateral card detail refresh: donut charts, risks, inspections and valuations. */
.donut-row {
  grid-template-columns: 184px minmax(0, 1fr);
  gap: 20px;
}

.donut {
  width: 170px;
  height: 170px;
  margin: 8px auto 12px;
  border: 1px solid #d6e1ec;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.75), 0 16px 34px rgba(23, 32, 51, 0.10);
}

.donut span {
  width: 108px;
  height: 108px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #dbe3ee;
  box-shadow: 0 10px 24px rgba(23, 32, 51, 0.08);
  font-size: 22px;
  font-weight: 800;
}

.legend-list button {
  display: grid;
  grid-template-columns: 12px minmax(120px, 1fr) auto;
  gap: 10px;
  align-items: center;
  min-height: 38px;
  padding: 8px 10px;
  text-align: left;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
}

.legend-list button:hover,
.legend-list button:focus-visible {
  background: var(--accent-soft);
  border-color: var(--accent);
  outline: none;
}

.legend-list i {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 0 0 3px rgba(23, 32, 51, 0.08);
}

.legend-list span {
  color: var(--text);
  font-weight: 650;
}

.legend-list strong {
  color: var(--accent-dark);
}

.collateral-tab-view {
  display: grid;
  gap: 14px;
}

.tab-summary-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
  padding: 18px 20px;
  background: #ffffff;
  border: 1px solid var(--line);
  border-top: 4px solid var(--accent);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.tab-summary-card h2 {
  margin: 4px 0 6px;
  color: var(--text);
  font-size: 21px;
}

.tab-summary-card p {
  max-width: 760px;
  margin: 0;
  color: var(--muted);
  line-height: 1.45;
}

.tab-summary-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
}

.tab-feature-grid {
  align-items: stretch;
}

.collateral-inspections-view .tab-summary-card {
  border-top-color: var(--accent);
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
}

.monitoring-settings-panel,
.inspection-card,
.inspection-table,
.valuation-history,
.risk-signals-panel,
.risk-rules-panel {
  position: relative;
  overflow: hidden;
}

.monitoring-settings-panel::before,
.inspection-card::before,
.inspection-table::before,
.valuation-history::before,
.risk-signals-panel::before,
.risk-rules-panel::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  content: "";
  background: var(--accent);
}

.monitoring-settings-grid {
  grid-template-columns: repeat(4, minmax(160px, 1fr));
}

.monitoring-settings-panel input[readonly] {
  color: var(--muted);
  background: #eef3f8;
}

.inspection-card .info-grid div {
  background: #f8fafc;
}

.inspection-table tbody tr:first-child td {
  background: #fbfdff;
  font-weight: 650;
}

.collateral-values-view .tab-summary-card {
  border-top-color: var(--amber);
}

.valuation-metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(130px, 1fr));
  gap: 10px;
  min-width: 520px;
}

.valuation-metrics div {
  min-height: 64px;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.valuation-metrics span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 12px;
}

.valuation-metrics strong {
  color: var(--text);
  font-size: 15px;
}

.valuation-history::before {
  background: var(--amber);
}

.valuation-history tbody tr:first-child td {
  background: #fffaf0;
}

.valuation-history-panel {
  border-top-color: var(--amber);
}

.valuation-chart-summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}

.valuation-chart-summary div {
  min-height: 54px;
  padding: 8px 10px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.valuation-chart-summary span {
  display: block;
  margin-bottom: 3px;
  color: var(--muted);
  font-size: 12px;
}

.valuation-chart-summary strong {
  color: var(--text);
  font-size: 16px;
}

.valuation-delta.ok {
  color: var(--green);
}

.valuation-delta.warn {
  color: #b45309;
}

.valuation-delta.danger {
  color: var(--red);
}

.valuation-chart-box {
  padding: 12px 14px 10px;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.valuation-line-chart {
  display: block;
  width: 100%;
  height: 300px;
  min-height: 0;
}

.valuation-axis,
.valuation-grid-line,
.valuation-date-guide {
  vector-effect: non-scaling-stroke;
}

.valuation-axis {
  stroke: #94a3b8;
  stroke-width: 1.4;
}

.valuation-grid-line {
  stroke: #e2e8f0;
  stroke-width: 1.1;
}

.valuation-date-guide {
  stroke: #eef2f7;
  stroke-width: 1;
}

.valuation-series {
  fill: none;
  stroke-width: 3.4;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.valuation-series.market {
  stroke: var(--accent);
}

.valuation-series.pledge {
  stroke: var(--amber);
}

.valuation-point {
  stroke: #fff;
  stroke-width: 2.4;
  vector-effect: non-scaling-stroke;
}

.valuation-point.market {
  fill: var(--accent);
}

.valuation-point.pledge {
  fill: var(--amber);
}

.valuation-axis-label {
  fill: #64748b;
  font-size: 13px;
  letter-spacing: 0;
}

.valuation-axis-label.y-label {
  text-anchor: end;
}

.valuation-axis-label.x-label {
  text-anchor: middle;
  font-weight: 650;
}

.valuation-chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.valuation-chart-legend span {
  display: inline-flex;
  gap: 7px;
  align-items: center;
}

.valuation-chart-legend i {
  width: 24px;
  height: 5px;
  border-radius: 999px;
}

.valuation-chart-legend i.market {
  background: var(--accent);
}

.valuation-chart-legend i.pledge {
  background: var(--amber);
}

.collateral-risks-view .tab-summary-card {
  border-top-color: var(--red);
}

.risk-score-ring {
  display: grid;
  width: 104px;
  height: 104px;
  place-items: center;
  background: conic-gradient(var(--red) 0 38%, var(--amber) 38% 68%, var(--accent) 68% 100%);
  border-radius: 50%;
  box-shadow: 0 14px 28px rgba(23, 32, 51, 0.12);
}

.risk-score-ring span {
  display: grid;
  width: 68px;
  height: 68px;
  place-items: center;
  color: var(--text);
  background: #ffffff;
  border: 1px solid #ead1d8;
  border-radius: 50%;
  font-size: 26px;
  font-weight: 800;
}

.risk-signals-panel::before {
  background: var(--red);
}

.risk-rules-panel::before {
  background: var(--amber);
}

.risk-panel {
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 10px;
}

.risk-item {
  min-height: 88px;
  padding: 12px;
  background: #fbfcfc;
  border-color: var(--line);
  box-shadow: none;
}

.risk-item:hover,
.risk-item:focus-visible {
  outline: none;
  transform: translateY(-1px);
  box-shadow: 0 10px 20px rgba(23, 32, 51, 0.08);
}

.risk-item.ok {
  background: #f0fdf4;
  border-left-color: var(--green);
}

.risk-item.warn {
  background: #fffaf0;
  border-left-color: var(--amber);
}

.risk-item.critical {
  background: #fff7f9;
  border-color: #f2b7c3;
  border-left-color: var(--red);
}

.risk-item span {
  color: var(--text);
  font-weight: 650;
}

.risk-item strong {
  align-self: end;
  justify-self: start;
  padding: 3px 7px;
  color: var(--accent-dark);
  background: var(--accent-soft);
  border-radius: 999px;
  font-size: 12px;
}

.risk-item.warn strong {
  color: #92400e;
  background: var(--amber-soft);
}

.risk-item.critical strong {
  color: var(--red);
  background: var(--red-soft);
}

.score-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: center;
  padding: 12px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.score-card span,
.score-card p {
  color: var(--muted);
}

.score-card strong {
  grid-row: 1 / span 2;
  grid-column: 2;
  color: var(--text);
  font-size: 28px;
}

.score-card p {
  margin: 0;
}

.risk-rule-list {
  display: grid;
  gap: 10px;
}

.risk-rule-list button {
  display: grid;
  grid-template-columns: minmax(120px, 1fr) auto;
  gap: 6px 10px;
  align-items: center;
  width: 100%;
  padding: 12px;
  text-align: left;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.risk-rule-list button:hover,
.risk-rule-list button:focus-visible {
  background: var(--accent-soft);
  border-color: #93c5fd;
  outline: none;
}

.risk-rule-list span {
  color: var(--text);
  font-weight: 700;
}

.risk-rule-list small {
  grid-column: 1 / -1;
  color: var(--muted);
  line-height: 1.4;
}

@media (max-width: 1180px) {
  .tab-summary-card,
  .valuation-metrics,
  .valuation-chart-summary {
    grid-template-columns: 1fr;
    min-width: 0;
  }

  .risk-panel {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .donut-row,
  .tab-summary-card,
  .valuation-metrics,
  .valuation-chart-summary,
  .risk-panel {
    grid-template-columns: 1fr;
  }

  .tab-summary-actions {
    justify-content: flex-start;
  }

  .risk-score-ring {
    width: 92px;
    height: 92px;
  }
}

/* Task creation flow refresh: object pool, document binding and confirmation. */
.task-create-stepper span {
  min-width: 150px;
}

.task-create-layout .panel,
.task-pool-panel,
.task-confirm-panel {
  position: relative;
  overflow: hidden;
}

.task-create-layout .panel::before,
.task-pool-panel::before,
.task-confirm-panel::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  content: "";
  background: var(--accent);
}

.task-create-summary::before,
.task-confirm-panel::before {
  background: var(--amber);
}

.task-pool-search {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) auto;
  gap: 14px;
  align-items: end;
  margin-bottom: 12px;
}

.task-pool-search span {
  padding: 9px 12px;
  color: var(--accent-dark);
  background: var(--accent-soft);
  border: 1px solid #93c5fd;
  border-radius: 8px;
  font-weight: 700;
  white-space: nowrap;
}

.task-create-action {
  border-color: transparent;
  font-weight: 750;
}

.task-create-footer {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.task-create-actions {
  display: grid;
  grid-template-columns: repeat(3, minmax(190px, max-content));
  gap: 8px;
  align-items: stretch;
}

.task-create-action.pick {
  color: var(--accent-dark);
  background: #dbeafe;
  border-color: #93c5fd;
}

.task-create-action.add {
  color: #1e3a8a;
  background: #dbeafe;
  border-color: #93c5fd;
}

.task-create-action.import {
  color: #7a4208;
  background: #fff1cc;
  border-color: #f3d587;
}

.task-create-action:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.task-create-selection-note {
  display: inline-flex;
  width: fit-content;
  padding: 7px 10px;
  color: var(--accent-dark);
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 750;
}

.import-file-drop {
  display: grid;
  gap: 7px;
  margin: 10px 0 12px;
  padding: 10px;
  color: var(--text);
  background: #f8fafc;
  border: 1px dashed #93c5fd;
  border-radius: 8px;
  font-weight: 700;
}

.import-empty-state {
  margin: 0;
  padding: 20px;
  border: 1px dashed #cbd5e1;
}

.collateral-picker-table {
  max-height: 520px;
  overflow: auto;
}

.collateral-picker-table input[type="checkbox"] {
  width: 18px;
  min-height: 18px;
  padding: 0;
}

.collateral-picker-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.collateral-picker-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 10px;
  align-items: start;
  min-height: 72px;
  padding: 12px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.collateral-picker-item:hover {
  border-color: #93c5fd;
  box-shadow: 0 10px 22px rgba(37, 99, 235, 0.08);
}

.collateral-picker-item input {
  margin-top: 3px;
}

.collateral-picker-item strong,
.collateral-picker-item small {

}

.collateral-picker-item small {

}

.selected-pool-list {

  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0 0;
}

.selected-pool-chip {

  gap: 8px;
  align-items: center;
  min-height: 32px;
  padding: 5px 10px;
  color: var(--accent-dark);
  background: var(--accent-soft);
  border: 1px solid #93c5fd;
  border-radius: 999px;
  font-weight: 750;
}

.selected-pool-chip span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
}

.new-collateral-box {

  padding: 14px;
  background: #fbfdff;
  border: 1px dashed #93c5fd;
  border-radius: 8px;
}

.new-collateral-box h3 {
  margin-top: 0;
}

.document-target-list {
  display: grid;
  gap: 10px;
}

.document-target-row {
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(180px, .8fr);
  gap: 10px;
  align-items: center;
  padding: 10px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.document-target-row label {
  display: flex;
  gap: 8px;
  align-items: center;
  font-weight: 650;
}

.task-doc-summary {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.task-doc-summary span {
  padding: 5px 8px;
  color: #475569;
  background: #e2e8f0;
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 650;
}

.document-widget {
  position: relative;
  overflow: hidden;
  margin-bottom: 0;
}

.document-widget::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  content: "";
  background: var(--accent);
}

.document-container {
  display: grid;
  gap: 7px;
  margin-top: 10px;
}

.document-file-row {
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
}

.task-detail-sidebar .document-file-row {
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 8px;
  align-items: start;
  padding: 9px;
}

.task-detail-sidebar .document-file-row > div:first-child {
  min-width: 0;
}

.task-detail-sidebar .document-file-row strong,
.task-detail-sidebar .document-file-row span,
.task-detail-sidebar .document-file-row small {
  overflow-wrap: anywhere;
}

.task-detail-sidebar .document-file-meta {
  grid-column: 1 / -1;
  grid-row: 2;
  justify-content: flex-start;
}

.task-detail-sidebar .document-row-actions {
  grid-column: 2;
  grid-row: 1;
  justify-content: flex-end;
}

.document-file-row.empty-file {
  background: #fbfcfd;
  border-style: dashed;
}

.document-file-row.has-file {
  background: #f8fafc;
}

.document-file-row span,
.document-file-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.document-file-row span {
  margin-top: 2px;
}

.document-file-row small {
  margin-top: 4px;
}

.document-file-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: flex-end;
}

.document-row-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

.doc-add-button {
  display: inline-grid;
  min-width: 34px;
  min-height: 34px;
  padding: 0 10px;
  place-items: center;
  color: #fff;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 750;
}

.doc-download-button,
.doc-delete-button {
  display: inline-grid;
  width: 34px;
  height: 34px;
  padding: 0;
  place-items: center;
  color: var(--accent);
  background: #fff;
  border: 1px solid var(--accent);
  border-radius: 8px;
  cursor: pointer;
  text-decoration: none;
}

.doc-delete-button {
  color: var(--red);
  border-color: #fecaca;
}

.doc-download-button svg,
.doc-delete-button svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.doc-download-button:hover {
  color: #fff;
  background: var(--accent);
  box-shadow: 0 0 0 3px rgba(8, 145, 178, 0.14);
}

.doc-delete-button:hover {
  color: #fff;
  background: var(--red);
  border-color: var(--red);
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
}

.doc-add-button.secondary {
  color: var(--accent);
  background: #fff;
}

.doc-add-button input {
  display: none;
}

.route-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.task-route-panel .timeline {
  gap: 5px;
  margin-bottom: 8px;
}

.task-route-panel .timeline span {
  padding: 6px 8px;
}

.route-approval-note {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 5px 8px;
  align-items: center;
  margin: 8px 0;
  padding: 9px;
  background: #f8fbfe;
  border: 1px solid #d4e0ec;
  border-left: 4px solid var(--accent);
  border-radius: 7px;
}

.route-approval-note strong {
  min-width: 0;
  overflow: hidden;
  color: var(--text);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.route-approval-note p {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.task-route-panel .route-actions {
  display: grid;
  grid-template-columns: 1fr;
}

.task-route-panel .btn {
  justify-content: center;
  width: 100%;
}

.task-history-list {
  display: grid;
  gap: 7px;
}

.task-history-event {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 5px 8px;
  align-items: start;
  padding: 8px;
  background: var(--surface-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.task-history-event strong,
.task-history-event span,
.task-history-event p {
  display: block;
}

.task-history-event span {
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}

.task-history-event .badge {
  align-self: start;
  min-height: 0;
  padding: 3px 8px;
  line-height: 1.15;
  white-space: nowrap;
}

.task-history-event p {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
}

.monitoring-task-layout {
  display: grid;
  gap: 10px;
  margin-bottom: 0;
}

.active-object-banner {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 14px 16px;
  background: linear-gradient(135deg, #eff6ff, #f7fbfd);
  border: 1px solid #d6e1ec;
  border-left: 4px solid var(--accent);
  border-radius: 8px;
}

.active-object-banner strong,
.active-object-banner small {
  display: block;
}

.active-object-banner small {
  margin-top: 3px;
  color: var(--muted);
}

.task-object-selector {
  border-top-color: var(--accent);
}

.task-object-selector tbody tr {
  cursor: pointer;
}

.task-object-selector tbody tr:hover,
.task-object-selector tbody tr.is-active {
  background: #eff6ff;
}

.task-object-selector tbody tr.is-active {
  box-shadow: inset 4px 0 0 var(--accent);
}

.task-object-selector td small {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.task-collateral-panel .panel-title {
  margin-bottom: 12px;
}

.task-collateral-info.table-panel,
.task-collateral-info .task-collateral-table-wrap {
  overflow-x: hidden;
}

.task-collateral-info table {
  width: 100%;
  min-width: 0;
  table-layout: fixed;
}

.task-collateral-info th,
.task-collateral-info td {
  padding: 8px 10px;
  vertical-align: middle;
}

.task-collateral-info tbody tr {
  cursor: pointer;
  height: auto;
  min-height: 58px;
}

.task-collateral-info th:nth-child(1),
.task-collateral-info td:nth-child(1) {
  width: 7%;
}

.task-collateral-info th:nth-child(2),
.task-collateral-info td:nth-child(2) {
  width: 10%;
}

.task-collateral-info th:nth-child(3),
.task-collateral-info td:nth-child(3) {
  width: 18%;
}

.task-collateral-info th:nth-child(4),
.task-collateral-info td:nth-child(4) {
  width: 24%;
}

.task-collateral-info th:nth-child(5),
.task-collateral-info td:nth-child(5) {
  width: 14%;
}

.task-collateral-info th:nth-child(6),
.task-collateral-info td:nth-child(6) {
  width: 9%;
}

.task-collateral-info th:nth-child(7),
.task-collateral-info td:nth-child(7),
.task-collateral-info th:nth-child(8),
.task-collateral-info td:nth-child(8) {
  width: 9%;
  font-size: 11px;
  white-space: nowrap;
}

.task-collateral-cell {
  display: -webkit-box;
  overflow: hidden;
  max-width: 100%;
  line-height: 1.25;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 1;
}

.task-collateral-cell.is-object {
  -webkit-line-clamp: 2;
}

.task-collateral-cell.is-address {
  display: block;
  overflow: visible;
  white-space: normal;
  overflow-wrap: anywhere;
  -webkit-line-clamp: unset;
}

.task-collateral-info td small {
  display: block;
  overflow: hidden;
  max-width: 100%;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
}

.compact-table {
  overflow-x: auto;
  overflow-y: visible;
}

.task-collateral-table-wrap {
  overflow-y: visible;
}

.task-collateral-table-wrap.is-scrollable {
  max-height: 810px;
  overflow-y: auto;
}

.task-collateral-table-wrap.is-scrollable thead th {
  position: sticky;
  top: 0;
  z-index: 2;
}

.btn:disabled {
  cursor: not-allowed;
  opacity: .55;
  box-shadow: none;
}

@media (max-width: 980px) {
  .task-pool-search,
  .collateral-picker-list,
  .document-target-row,
  .document-file-row {
    grid-template-columns: 1fr;
  }

  .document-file-meta,
  .document-row-actions {
    justify-content: flex-start;
  }
}

/* Collateral external sources and document dossier refresh. */
.collateral-external-view,
.collateral-documents-view {
  display: grid;
  gap: 14px;
}

.external-summary,
.documents-summary {
  border-top-color: var(--accent);
}

.external-summary-meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 1fr));
  gap: 10px;
  min-width: 300px;
}

.documents-summary .external-summary-meta {
  grid-template-columns: repeat(3, minmax(100px, 1fr));
}

.external-summary-meta div {
  min-height: 62px;
  padding: 10px 12px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.external-summary-meta span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);

}

.external-summary-meta strong {
  color: var(--text);

}

.external-source-panel {

}

.external-attribute-panel {

  overflow: hidden;
}

.external-attribute-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 12px;
}

.external-attribute-column {
  display: grid;
  gap: 12px;
  align-content: start;
  min-width: 0;
}

.external-attribute-card {
  display: grid;
  gap: 10px;
  align-content: start;
  padding: 12px;
  background: #f8fafc;
  border: 1px solid #d9e0e7;

}

.external-attribute-card-head {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  justify-content: space-between;
  padding-bottom: 8px;
  border-bottom: 1px solid #d9e0e7;
}

.external-attribute-card-head h3 {
  margin: 0 0 4px;
  font-size: 16px;

}

.external-attribute-card-head span {
  color: var(--muted);
  font-size: 12px;
}

.external-attribute-card-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  justify-content: flex-end;
}

.external-attribute-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.external-attribute-item {
  display: grid;
  gap: 4px;
  min-height: 58px;
  padding: 9px 10px;
  background: #fff;
  border: 1px solid #e2e8f0;
  border-left: 3px solid var(--green);
  border-radius: 7px;
}

.external-attribute-item.warn {
  border-left-color: var(--amber);
}

.external-attribute-item.neutral {
  border-left-color: #94a3b8;
}

.external-attribute-item span,
.external-attribute-item small {
  color: var(--muted);
  font-size: 12px;
}

.external-attribute-item strong {
  color: var(--text);
  font-size: 14px;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.external-source-panel table {
  min-width: 1220px;
}

.external-source-panel td {
  vertical-align: top;
  line-height: 1.35;
}

.external-source-panel td:nth-child(6) {

}

.external-source-panel td:last-child {
  white-space: nowrap;
}

.external-source-row-unavailable {
  background: #f8fafc;
}

.external-source-row-unavailable td,
.external-source-row-unavailable strong,
.external-source-row-unavailable small {

}

.external-source-row-unavailable .badge {

}

.external-source-row-unavailable .external-row-sync {
  color: #94a3b8;
  background: #f1f5f9;
  border-color: #cbd5e1;

}

.external-row-sync {
  white-space: nowrap;
}

.document-dossier-panel {
  position: relative;
  overflow: hidden;
}

.document-dossier-panel::before,
.collateral-contracts-panel::before,
.collateral-pledgors-panel::before,
.external-attribute-panel::before,
.external-source-panel::before {
  position: absolute;

  left: 0;
  width: 100%;
  height: 3px;
  content: "";
  background: var(--accent);
}

.collateral-pledgors-panel::before {
  background: var(--amber);
}

.document-dossier-panel .doc-list {
  margin-top: 4px;
}

@media (max-width: 980px) {
  .external-summary-meta,
  .documents-summary .external-summary-meta,
  .external-attribute-groups,
  .external-attribute-list {
    grid-template-columns: 1fr;
    min-width: 0;
  }

.metric-mini {
  display: grid;
  gap: 4px;
  padding: 10px;
  border: 1px solid var(--line);

.metric-mini span {
  color: var(--muted);
  font-size: 12px;
}

.metric-mini strong {

}

.modal-actions {

}

.overview-summary {

}

.market-final-row td {

/* Single-line application header with abstract pledge-module logo. */
.app-header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: center;
  min-height: 64px;
  padding: 10px 28px;
  background: linear-gradient(90deg, #111827 0%, #172033 54%, #1e3a8a 100%);
  border-bottom: 1px solid rgba(147, 197, 253, 0.22);
  box-shadow: 0 14px 28px rgba(23, 32, 51, 0.18);
}

.header-left {
  display: flex;
  gap: 24px;
  align-items: center;
  min-width: 0;
}

.app-header .brand {
  flex: 0 0 auto;
  gap: 10px;
  min-width: auto;
}

.brand-title {
  color: #f7fbfb;
  font-size: 16px;
  font-weight: 760;
  letter-spacing: 0;
  white-space: nowrap;
}

.app-header .brand-mark {
  position: relative;
  width: 42px;
  height: 42px;
  overflow: hidden;
  background:
    radial-gradient(circle at 68% 24%, rgba(255, 255, 255, 0.42), transparent 18%),
    linear-gradient(145deg, #60a5fa 0%, #2563eb 48%, #1e40af 100%);
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 13px;
  box-shadow: inset 0 -12px 22px rgba(30, 64, 175, 0.28), 0 10px 22px rgba(0, 0, 0, 0.24);
}

.logo-letter,
.logo-pledge,
.logo-corner {
  position: absolute;
  display: block;
}

.logo-letter {
  inset: 5px 0 0;
  color: #ffffff;
  font-size: 24px;
  font-weight: 900;
  line-height: 1;
  text-align: center;
  text-shadow: 0 2px 8px rgba(23, 32, 51, 0.28);
}

.logo-pledge {
  right: 9px;
  bottom: 9px;
  left: 9px;
  height: 4px;
  background: #bfdbfe;
  border-radius: 999px;
  box-shadow: 0 -7px 0 rgba(191, 219, 254, 0.32);
}

.logo-corner {
  top: 8px;
  right: 8px;
  width: 9px;
  height: 9px;
  border-top: 2px solid rgba(255, 255, 255, 0.72);
  border-right: 2px solid rgba(255, 255, 255, 0.72);
  border-radius: 0 4px 0 0;
}

.top-nav {
  display: flex;
  gap: 6px;
  align-items: center;
  min-width: 0;
  overflow-x: auto;
}

.top-nav button {
  min-height: 38px;
  padding: 0 14px;
  color: #dbeafe;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  font-weight: 650;
  white-space: nowrap;
}

.top-nav button:hover {
  color: #ffffff;
  background: rgba(219, 234, 254, 0.09);
  border-color: rgba(147, 197, 253, 0.28);
}

.top-nav button.active {
  color: #ffffff;
  background: #2563eb;
  border-color: #60a5fa;
  box-shadow: 0 8px 18px rgba(37, 99, 235, 0.28);
}

.app-header .role-box {
  flex: 0 0 auto;
  min-width: max-content;
  margin-left: auto;
}

.app-header .role-user {
  max-width: none;
  overflow: visible;
  color: #dbeafe;
  font-weight: 650;
  text-overflow: clip;
  white-space: nowrap;
}

.app-header .role-box select {
  min-height: 38px;
  color: #f7fbfb;
  background: rgba(23, 32, 51, 0.92);
  border-color: rgba(147, 197, 253, 0.30);
}

.app-header .role-box select:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.24);
}

@media (max-width: 980px) {
  .app-header {
    flex-wrap: wrap;
    padding-right: 16px;
    padding-left: 16px;
  }

  .header-left {
    flex: 1 1 100%;
    justify-content: space-between;
  }

  .top-nav {
    max-width: 100%;
  }
}

@media (max-width: 720px) {
  .brand-title {
    font-size: 14px;
  }

  .app-header .role-user {
    display: none;
  }
}

.table-panel .log-row:hover {

/* Task creation: scans are attached per selected collateral object. */
.task-scan-layout {
  grid-template-columns: minmax(0, 1.45fr) minmax(340px, .75fr);
}

.task-scan-panel {
  position: relative;
  overflow: hidden;
}

.task-scan-panel::before {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 3px;
  content: "";
  background: var(--accent);
}

.scan-collateral-list {
  display: grid;
  gap: 12px;
}

.scan-collateral-card {
  overflow: hidden;
  background: #f8fafc;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.scan-card-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px;
  background: #eff6ff;
  border-bottom: 1px solid #d9e0e7;
}

.scan-card-head strong,
.scan-card-head span {
  display: block;
}

.scan-card-head span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.scan-row-list {
  display: grid;
  gap: 0;
}

.scan-row {
  display: grid;
  grid-template-columns: minmax(230px, 1fr) minmax(190px, .75fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid #e2e8f0;
}

.scan-row:last-child {
  border-bottom: 0;
}

.scan-row.attached {
  background: #fbfdff;
}

.scan-row strong,
.scan-row span {
  display: block;
}

.scan-row span {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.scan-row input[type="file"] {
  min-width: 0;
  padding: 7px;
  font-size: 12px;
  background: #ffffff;
  border: 1px solid #d9e0e7;
  border-radius: 8px;
}

.scan-actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}

@media (max-width: 1180px) {
  .task-scan-layout,
  .scan-row,
  .scan-card-head {
    grid-template-columns: 1fr;
  }

  .scan-actions {
    justify-content: flex-start;
  }
}

/* ARM experiment: left workspace rail and technical cyan-blue accents. */
body {
  background:
    linear-gradient(135deg, rgba(8, 145, 178, 0.08) 0 1px, transparent 1px 42px),
    linear-gradient(90deg, rgba(37, 99, 235, 0.06) 0 1px, transparent 1px 54px),
    var(--bg);
}

.app-shell {
  display: grid;
  grid-template-columns: 212px minmax(0, 1fr);
  align-items: start;
  min-height: 100vh;
}

.arm-sidebar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  grid-row: 1 / span 3;
  grid-column: 1;
  gap: 14px;
  height: 100vh;
  padding: 14px 12px;
  overflow: hidden;
  color: #eef6ff;
  background:
    linear-gradient(180deg, rgba(8, 145, 178, 0.18), transparent 32%),
    linear-gradient(155deg, var(--arm-rail) 0%, var(--arm-rail-2) 58%, #0f172a 100%);
  border-right: 1px solid rgba(148, 163, 184, 0.24);
  box-shadow: 16px 0 34px rgba(17, 24, 39, 0.18);
}

.arm-sidebar::before,
.arm-sidebar::after {
  position: absolute;
  right: 0;
  left: 0;
  pointer-events: none;
  content: "";
}

.arm-sidebar::before {
  top: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--cyan), var(--arm-hot), var(--arm-contrast));
}

.arm-sidebar::after {
  bottom: 0;
  height: 180px;
  background:
    repeating-linear-gradient(135deg, rgba(96, 165, 250, 0.12) 0 1px, transparent 1px 11px);
  opacity: 0.65;
}

.sidebar-brand-wrap {
  position: relative;
  z-index: 1;
  padding: 2px 0 12px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.22);
}

.arm-sidebar .brand {
  width: 100%;
  color: #f8fbff;
}

.arm-sidebar .brand-visual-logo {
  display: block;
  min-height: 44px;
  padding: 0 2px;
  background: transparent;
  border: 0;
}

.system-logo {
  display: block;
  width: 100%;
  max-width: 178px;
  height: auto;
  color: #a8c7dd;
  filter: none;
  transition: transform 160ms ease, filter 160ms ease;
}

.brand-visual-logo:hover .system-logo {
  transform: translateY(-1px);
  filter: drop-shadow(0 8px 16px rgba(34, 211, 238, 0.10));
}

.system-logo .logo-track,
.system-logo .logo-baseline {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.system-logo .logo-track {
  stroke-width: 2;
  opacity: 0.62;
}

.system-logo .logo-baseline {
  stroke-width: 1.4;
  opacity: 0.28;
}

.system-logo .logo-object,
.system-logo .logo-shield {
  fill: none;
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.system-logo .logo-object {
  stroke-width: 2;
  opacity: 0.70;
}

.system-logo .logo-shield {
  color: #67e8f9;
  stroke-width: 2.2;
  opacity: 0.86;
}

.system-logo .logo-shield path:last-child {
  stroke-width: 2.5;
}

.system-logo .logo-dots {
  fill: #67e8f9;
  opacity: 0.72;
}

.brand-visual-logo:hover .system-logo .logo-object,
.brand-visual-logo:hover .system-logo .logo-track {
  opacity: 0.88;
}

.arm-sidebar .brand-title {
  color: #f8fbff;
  font-size: 15px;
}

.arm-sidebar .brand-mark {
  position: relative;
  width: 44px;
  height: 44px;
  overflow: hidden;
  border-radius: 10px;
  background:
    linear-gradient(135deg, rgba(255, 255, 255, 0.38), transparent 24%),
    linear-gradient(145deg, #22d3ee 0%, #2563eb 48%, #1e3a8a 100%);
  box-shadow: inset 0 -12px 22px rgba(30, 64, 175, 0.32), 0 12px 24px rgba(0, 0, 0, 0.26);
}

.arm-sidebar .top-nav {
  position: relative;
  z-index: 1;
  display: grid;
  gap: 6px;
  align-items: start;
  min-width: 0;
  overflow-y: auto;
}

.arm-sidebar .top-nav button {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 40px;
  padding: 0 10px 0 13px;
  color: #cbd5e1;
  text-align: left;
  background: rgba(15, 23, 42, 0.30);
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 7px;
  box-shadow: none;
}

.arm-sidebar .top-nav button::before {
  width: 6px;
  height: 6px;
  margin-right: 9px;
  content: "";
  background: #64748b;
  border-radius: 999px;
}

.arm-sidebar .top-nav button:hover {
  color: #ffffff;
  background: rgba(8, 145, 178, 0.18);
  border-color: rgba(34, 211, 238, 0.38);
}

.arm-sidebar .top-nav button.active {
  color: #ffffff;
  background: linear-gradient(90deg, rgba(8, 145, 178, 0.34), rgba(37, 99, 235, 0.22));
  border-color: rgba(34, 211, 238, 0.54);
  box-shadow: inset 3px 0 0 #22d3ee, 0 12px 22px rgba(8, 145, 178, 0.14);
}

.arm-sidebar .top-nav button.active::before {
  background: #22d3ee;
  box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.16);
}

.sidebar-signal {

  gap: 6px;

  padding: 12px 4px 4px;
}

.sidebar-signal span {
  height: 3px;

}

.sidebar-signal span:nth-child(2) {

.sidebar-signal span:nth-child(3) {
  width: 48%;

}

.app-header {
  position: sticky;
  top: 0;
  z-index: 25;

  grid-column: 2;
  gap: 18px;
  align-items: center;
  justify-content: space-between;
  min-height: 66px;
  padding: 12px 30px;
  background: rgba(255, 255, 255, 0.92);
  border-bottom: 1px solid rgba(174, 188, 204, 0.78);
  box-shadow: 0 12px 28px rgba(17, 24, 39, 0.08);
  backdrop-filter: blur(12px);
}

.workspace-heading {
  position: relative;
  display: grid;
  min-width: 0;
  padding-left: 16px;
}

.workspace-heading::before {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 0;
  width: 4px;
  content: "";
  background: linear-gradient(180deg, var(--cyan), var(--arm-hot));
  border-radius: 999px;
}

.workspace-heading::after {
  position: absolute;
  top: 50%;
  left: calc(100% + 18px);
  width: 112px;
  height: 18px;
  content: "";
  background: repeating-linear-gradient(90deg, rgba(8, 145, 178, 0.26) 0 2px, transparent 2px 9px);
  transform: translateY(-50%);
}

.workspace-heading span {
  color: var(--muted);

}

.workspace-heading strong {

.app-header .role-box {

  align-items: center;
  flex: 0 0 auto;

}

.app-header .role-user {

.app-header .role-box select {

  border-color: var(--line-strong);
}

.main {

}

.page-header {

}

.page-header h1 {

.page-header p {

.breadcrumbs {

.panel,

.registry-filter-grid {

.filter-field input,
.filter-field select {

.filter-field input:focus,
.filter-field select:focus,
input:focus,
select:focus,
textarea:focus {

.table-panel {
